name: CI

# Mainline, the active alpha line, and the active stable-release branch.
#
# This previously triggered on master only, on the stated precondition that
# v1.0-alpha was kept in ff-only lockstep with master (same SHA), making a second
# run pure quota burn. That precondition is VOID: on 2026-07-20 v1.0-alpha was
# measured 86 commits ahead of master, and 31 of the last 62 fixes - 28 of them
# user-visible - had received zero CI runs. A real break hid there once before
# for 8 commits; this time thirteen defects were fixed between two and five times
# each, all inside the un-gated window.
#
# Do NOT restore the master-only optimization without first restoring the
# lockstep it depends on. If the double-run cost matters, merge alpha into master
# rather than narrowing the trigger. See docs/agent-memory/TEST-STRATEGY-v2.md.
on:
  push:
    branches: [main, master, 'v1.0-alpha', 'release/1.0.0']
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE*'
  pull_request:
    branches: [main, master, 'v1.0-alpha', 'release/1.0.0']
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # --- Rust Core ---
  # One job, one toolchain setup: fmt + clippy(--all-targets) + test previously ran
  # as THREE jobs - three checkouts and toolchain installs wrapping ~90s of real
  # work. Sequential; a failure still names its step. Security Audit moved to the
  # scheduled supply-chain workflow (an advisory feed does not change per push);
  # Docs & Links moved to docs.yml (runs only when docs change).
  rust:
    name: Rust (fmt + clippy + test)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # action commit pinned
        with:
          toolchain: '1.86.0'
          components: rustfmt, clippy
      - name: Format check
        working-directory: core
        run: cargo fmt --check
      - name: Clippy (--all-targets - --lib misses test-code lints)
        working-directory: core
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        working-directory: core
        run: cargo test --locked
      # The licence issuer tool (not shipped) mints the keys that unlock paid
      # features, so its crypto correctness - a minted key verifies, a forged
      # payload does not, a name can't inject a higher tier - is gated too. Folded
      # into this existing job (no new job) to keep the Actions budget flat.
      - name: Licence tool (fmt + clippy + test)
        working-directory: tools/license-tool
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
      - name: Licence webhook (fmt + clippy + test)
        working-directory: tools/license-webhook
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      matrix:
        os: [ubuntu-24.04]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # action commit pinned
        with:
          toolchain: '1.86.0'
      # Ubuntu 24.04's apt Qt is 6.4.2; the project's supported floor is 6.9
      # (see docs/DISTRIBUTION.md §1), and it needs QML modules the minimal apt
      # packages omit (QtQml.WorkerScript, QtQuick.Effects). The pin is the
      # FLOOR on purpose: CI's job is to catch what breaks on the OLDEST Qt this
      # product claims to support, not on the newest one a developer happens to
      # have. Raise this only together with the floor in CMakeLists.txt.
      - name: Install Qt 6.9
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.9.3'
          cache: true
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libgl1-mesa-dev
      - name: Build Rust core
        run: cargo build --release --locked
        working-directory: core
      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build C++ application
        run: cmake --build build -j$(nproc)
      - name: Verify binary
        run: |
          test -x build/xeneon-edge-hub
          test -x build/xeneon-edge-manager

  qml-test:
    name: QML Tests + Enumerated Requirements
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Full Qt at the supported floor: the apt qt6-declarative is 6.4.2 and
      # lacks bundled QML modules (QtQml.WorkerScript, QtQuick.Effects) the
      # widgets need. Keep in step with CMakeLists.txt's find_package floor.
      - name: Install Qt 6.9 (+ qmltestrunner)
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.9.3'
          cache: true
      - name: Install build tools, runtime libs + fonts
        # A real scalable font is required: several tests assert text metrics
        # (Text.fontSizeMode fit, paintedWidth <= tile), which have no meaningful
        # value under the offscreen platform with no font installed.
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libgl1-mesa-dev libxkbcommon0 libgl1 fonts-dejavu-core fontconfig
          sudo fc-cache -f
      - name: Run QML GUI tests (compiled resources, offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./scripts/run_ui_tests.sh
      - name: Require every enumerated QML requirement to be assertion-backed
        run: python3 scripts/qml_coverage.py | tee qml-enumerated-requirements.txt
      # The two structural lints. They lived only in run_all_tests.sh, i.e. they
      # gated nothing anyone was forced to run - and the egress lint is the whole
      # basis of the "no telemetry" claim, so it has to hold on every push, not
      # just when a dev remembers. Both are plain bash with no deps.
      - name: Egress lint (no raw XHR outside the NetHub gate)
        run: bash scripts/check_no_raw_xhr.sh
      - name: Enforce that every test actually runs (QtTest '_data' trap)
        run: bash scripts/check_live_tests.sh
      - name: Enforce that UI links go somewhere
        run: bash scripts/check_ui_links.sh
      - name: Icon lint (every widget type has a bundled, registered icon)
        run: bash scripts/check_widget_icons.sh
      # The Manager is tested against a REAL hub on REAL hardware, never inside
      # a nested compositor with a stubbed backend. That layer added no fidelity
      # and silently corrupted pixel assertions (grabImage ignores item
      # position), so it reported bugs that did not exist.
      - name: No Manager tests under a nested compositor
        run: bash scripts/check_no_manager_compositor_tests.sh
      # Guards the scene-graph walk bug that OOMed the developer's machine
      # (18.8 GB / 20 GB RSS, three independent copies). It lived only in
      # run_all_tests.sh - i.e. it gated nothing anyone was forced to run.
      - name: Tree-walk memory guard (the 18.8 GB OOM class)
        run: python3 scripts/check_tree_walks.py
      # Cross-file zsync delta-update invariants. Every one of the four files it
      # spans was independently broken while the rest of the suite stayed green.
      - name: AppImage update contract
        run: bash scripts/check_appimage_update_contract.sh
      - name: Release provenance and signed SBOM contract
        run: bash scripts/check_release_provenance_contract.sh
      - name: CI, toolchain, packaging, and release metadata contract
        run: python3 scripts/check_ci_release_metadata_contract.py
      - name: Certified native package byte-binding contract
        run: bash scripts/check_native_package_binding_contract.sh
      - name: Signed audit-artifact finalizer contract
        run: bash scripts/check_audit_artifact_finalizer.sh
      - name: Manual physical-touch sealing contract
        run: bash scripts/check_manual_touch_audit_contract.sh
      - name: Upload QML enumerated-requirements result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qml-enumerated-requirements
          path: qml-enumerated-requirements.txt

  # --- C++ tests + coverage capture ---
  cpp-test:
    name: C++ Tests + Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # action commit pinned
        with:
          toolchain: '1.86.0'
      - name: Install Qt 6.9
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.9.3'
          cache: true
      - name: Install build + coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libgl1-mesa-dev
          # Use a modern gcovr (via pipx, preinstalled on the runner): the apt
          # gcovr does not honor the in-source GCOVR_EXCL_START/STOP hardware/glue
          # exclusion markers, so it counts the excluded lines and understates
          # coverage. Pin the exact audited version used locally.
          gcovr_bin_dir="$RUNNER_TEMP/pipx-bin"
          mkdir -p "$gcovr_bin_dir"
          PIPX_BIN_DIR="$gcovr_bin_dir" pipx install gcovr==8.6
          echo "$gcovr_bin_dir" >> "$GITHUB_PATH"
          "$gcovr_bin_dir/gcovr" --version | grep -Fx 'gcovr 8.6'
      - name: Build Rust core (static lib for C++ tests)
        run: cargo build --release --locked
        working-directory: core
      - name: Configure CMake (tests + coverage)
        # XENEON_QA_HOOKS=ON is required by the smoke tests, which drive the real
        # binaries via XENEON_GRAB. It defaults to OFF so product builds ignore
        # the hook; the "Build" job above covers that default/product config.
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DXENEON_BUILD_TESTS=ON -DXENEON_COVERAGE=ON -DXENEON_QA_HOOKS=ON
      - name: Build
        run: cmake --build build -j$(nproc)
      - name: Run C++ tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure
      # Nine scenarios driving the REAL hub binary and asserting the persisted
      # config.toml. Exit 77 is a hard failure here: a CI tier with no binary did
      # no work and must not look green.
      - name: Runtime E2E battery (real hub binary)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          rc=0
          for f in tests/runtime/run_*.sh; do
            echo "==> $f"
            bash "$f" || { c=$?; [ "$c" = 77 ] && echo "   FAIL (no binary)" || echo "   FAIL ($c)"; rc=1; }
          done
          exit $rc
      - name: Capture C++ coverage (lcov)
        run: |
          mkdir -p coverage
          gcovr --root . \
            --filter 'app/src/' --filter 'manager/src/' \
            --exclude '.*main\.cpp' \
            --lcov coverage/cpp-lcov.info \
            build
      - name: Report C++ coverage gaps
        run: |
          gcovr --root . \
            --filter 'app/src/' --filter 'manager/src/' \
            --exclude '.*main\.cpp' \
            --txt --sort uncovered-number --sort-reverse \
            build
      - name: Enforce C++ >= 95%
        run: |
          pct=$(gcovr --root . \
            --filter 'app/src/' --filter 'manager/src/' \
            --exclude '.*main\.cpp' \
            build --json-summary \
            | python3 -c 'import json,sys; print("%.2f" % json.load(sys.stdin)["line_percent"])')
          echo "C++ line coverage: ${pct}%"
          python3 -c "import sys; sys.exit(0 if float('${pct}') >= 95 else 1)"
      - name: Upload C++ lcov
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cpp-lcov
          path: coverage/cpp-lcov.info

  # --- Rust coverage gate + non-gating combined diagnostic ---
  coverage:
    name: Rust Coverage Gate + Combined Report
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [rust, cpp-test]
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # action commit pinned
        with:
          # cargo-llvm-cov 0.8.7 declares Rust 1.87. Product MSRV remains
          # independently enforced by the Rust and build jobs on 1.86.0.
          toolchain: '1.87.0'
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov + lcov + gcovr
        run: |
          cargo install cargo-llvm-cov --version 0.8.7 --locked
          cargo llvm-cov --version | grep -Fx 'cargo-llvm-cov 0.8.7'
          sudo apt-get update
          sudo apt-get install -y lcov gcovr
      - name: Rust coverage (lcov + JSON summary)
        working-directory: core
        run: |
          mkdir -p ../coverage
          cargo llvm-cov --locked --lib --lcov --output-path ../coverage/rust-lcov.info
          cargo llvm-cov --locked --lib --json --summary-only --output-path ../coverage/rust-summary.json
      - name: Enforce Rust >= 95%
        run: |
          pct=$(python3 -c 'import json; print(json.load(open("coverage/rust-summary.json"))["data"][0]["totals"]["lines"]["percent"])')
          echo "Rust line coverage: ${pct}%"
          python3 -c "import sys; sys.exit(0 if float('${pct}') >= 95 else 1)"
      - name: Download C++ lcov artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cpp-lcov
          path: coverage
      - name: Merge Rust + C++ lcov
        run: |
          lcov --add-tracefile coverage/rust-lcov.info \
               --add-tracefile coverage/cpp-lcov.info \
               --output-file coverage/merged-lcov.info
      - name: Report merged Rust + C++ coverage (non-gating)
        run: |
          pct=$(python3 - <<'PY'
          total = hit = 0
          for line in open("coverage/merged-lcov.info"):
              if line.startswith("DA:"):
                  p = line[3:].strip().split(",")
                  if len(p) >= 2:
                      total += 1
                      if int(p[1]) > 0:
                          hit += 1
          print("%.2f" % (100.0 * hit / total if total else 100.0))
          PY
          )
          echo "Merged (Rust + C++) line coverage: ${pct}%"
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/

  # --- QML compositor suite (tests/gui) - REQUIRED ---
  # 16 files and 1,300+ checks under a real kwin_wayland at 2560x720 with real
  # input and rendered-pixel assertions. It holds the repository's only
  # compositor-backed aspect-ratio, rotation, navigation and wallpaper checks.
  # The runner propagates per-file failures and rejects skips, fatal QML
  # diagnostics and missing compiled resources.
  #
  gui-test:
    name: QML Compositor Suite
    runs-on: ubuntu-24.04
    # The suite runs 22 files, RUN_TIMEOUT-bounded, J at a time - so its worst case
    # is ceil(22/J) * RUN_TIMEOUT plus ~4 min of Qt/apt/build setup. At the previous
    # J=4 / RUN_TIMEOUT=900 that was 6 * 15 = 90 min against a 60 min cap, so a run
    # with several slow files could never finish: GitHub killed the job mid-suite,
    # the summary is only aggregated after `wait`, and the whole hour produced no
    # result at all. RUN_TIMEOUT=540 below makes the worst case 6 * 9 = 54 min, and
    # this cap leaves margin so the SCRIPT always reports before the runner kills it.
    # Keep the three numbers consistent if any of them changes.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # action commit pinned
        with:
          toolchain: '1.86.0'
      - name: Install Qt 6.9 (+ qmltestrunner)
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.9.3'
          cache: true
      - name: Install compositor + runtime libs
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ kwin-wayland xwayland libxkbcommon0 \
            libgl1-mesa-dev \
            fonts-dejavu-core fontconfig ffmpeg python3-pil
          # The product's system font stack is "Inter, Segoe UI, Roboto,
          # sans-serif" (ui/qml/Theme.qml). With only fonts-dejavu-core present
          # NONE of those resolve, so every system-stack string fell back to
          # DejaVu Sans - whose line height is taller than Inter/Roboto - and
          # overflowed layouts by 2-4px. That produced 368 clipping failures in
          # tst_gui_widget_legibility on run 30692759731, spread evenly across
          # all three font choices (system 115, hyperlegible 123, lexend 130)
          # because a widget mixes the chosen face with system-stack text. The
          # same file passes locally, where the stack resolves. Installing the
          # fonts the product actually targets makes this gate measure the
          # product's real rendering instead of a substitute it never ships.
          # Inter first (exact match), Roboto as the stack's own next choice.
          sudo apt-get install -y fonts-inter || sudo apt-get install -y fonts-inter-variable || true
          sudo apt-get install -y fonts-roboto-unhinted
          sudo fc-cache -f
          echo "resolved system stack:"; fc-match "Inter"; fc-match "Roboto"; fc-match "sans-serif"
      - name: Build the resource-aware QuickTest runner
        # Stock qmltestrunner has no product QRCs, so every qrc:/ icon,
        # wallpaper and font would be missing and rendered-pixel checks would be
        # meaningless. This small target embeds the same resources as the apps.
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DXENEON_BUILD_TESTS=ON
          cmake --build build --target xeneon-qmltestrunner -j"$(nproc)"
      - name: Run compositor suite
        # GitHub's GPU-less runner exposes KWin through LLVMpipe, but Qt Quick's
        # automatic Mesa selection can still pick Zink and leave Wayland windows
        # permanently unexposed. Keep the real OpenGL scenegraph (and therefore
        # rendered-pixel coverage), while selecting Mesa's CPU renderer explicitly.
        env:
          LIBGL_ALWAYS_SOFTWARE: "true"
          GALLIUM_DRIVER: llvmpipe
          # Each compositor and Qt Quick process otherwise creates a worker per
          # host core. Five parallel slots oversubscribe a four-core runner and
          # can exhaust the per-file wall clock despite making forward progress.
          LP_NUM_THREADS: "1"
          # Per-file bound. 540s is ~4x the slowest file that currently completes
          # (tst_gui_shell_nav_edit, 124s), and keeps ceil(22/4) waves inside the
          # job cap above. A file needing more than this is a broken test, not a
          # slow one - which is exactly what the per-file report now shows.
          RUN_TIMEOUT: "540"
        # CI is not a watchable demonstration. Remove the runner's deliberate
        # human-visible mouse/key delays so this required gate completes inside
        # the job limit without changing any assertion or bounded wait.
        run: bash tests/gui/run_gui_tests.sh --fast -j4
      - name: Install Pillow for the visual-baseline comparison
        # `python3-pil` above lands in the SYSTEM python, but install-qt-action
        # puts a tool-cache python first on PATH - so `python3` here is 3.12 from
        # /opt/hostedtoolcache with no Pillow, and the comparison exits with
        # "Pillow is required". Nobody saw it because this step only runs when
        # the compositor suite passes, and the suite had never passed. Install
        # into the interpreter that actually runs the script.
        run: python3 -m pip install --disable-pip-version-check --quiet pillow
      - name: Compare reviewed visual baselines
        run: python3 scripts/visual_baselines.py compare
      - name: Upload GUI evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gui-evidence
          path: |
            gui-evidence/
            build/gui-logs/
          if-no-files-found: ignore
